<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexio LaVs — Official Developer Site</title>
<meta name="description" content="Nexio LaVs（ネクシオラブス）が開発・提供するアプリ一覧">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1A0E06;--bg2:#2C1A0A;
  --accent:#E07018;--accent-d:#B85A10;
  --cream:#F5EDE4;--mid:#C9A888;--light:#8A6848;--border:rgba(224,112,24,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:radial-gradient(circle at 20% 0%, rgba(224,112,24,.14) 0%, transparent 45%),
             radial-gradient(circle at 90% 20%, rgba(224,112,24,.10) 0%, transparent 40%),
             var(--bg);
  color:var(--cream);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:880px;margin:0 auto;padding:64px 24px 80px}
.logo{font-size:15px;font-weight:800;letter-spacing:.06em;color:var(--cream);margin-bottom:56px}
.logo .hi{color:var(--accent)}
h1{
  font-family:'Playfair Display',Georgia,serif;
  font-weight:700;
  font-size:clamp(34px,6vw,52px);
  line-height:1.2;
  margin-bottom:16px;
  letter-spacing:-.01em;
}
h1 .accent{color:var(--accent);font-style:italic}
.lead{font-size:15px;color:var(--mid);line-height:1.9;max-width:520px;margin-bottom:56px}
.apps{display:grid;gap:16px}
.app-card{
  display:flex;align-items:center;gap:20px;
  padding:22px 24px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--border);
  border-radius:16px;
  text-decoration:none;
  color:inherit;
  transition:background .15s,border-color .15s,transform .15s;
}
.app-card:hover{background:rgba(224,112,24,.08);border-color:var(--accent);transform:translateY(-2px)}
.app-icon{
  width:56px;height:56px;flex-shrink:0;
  border-radius:14px;
  background:linear-gradient(145deg,var(--accent),var(--accent-d));
  display:flex;align-items:center;justify-content:center;
  font-size:26px;
}
.app-info{flex:1;min-width:0}
.app-name{font-size:17px;font-weight:800;color:var(--cream);margin-bottom:4px}
.app-desc{font-size:13px;color:var(--light);line-height:1.6}
.app-arrow{font-size:18px;color:var(--light)}
footer{margin-top:72px;font-size:12px;color:var(--light)}
footer a{color:var(--light)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Nexio&nbsp;<span class="hi">La</span>Vs</div>

  <h1>アプリで、<br>日々の記録を<span class="accent">やさしく</span>。</h1>
  <p class="lead">Nexio LaVs（ネクシオラブス）は、日々の記録や思い出をさりげなく整理するアプリを開発しています。</p>

  <div class="apps">
    <a class="app-card" href="/atomiru/">
      <div class="app-icon">📷</div>
      <div class="app-info">
        <div class="app-name">アトミル memories</div>
        <div class="app-desc">写真を撮るだけで、予定に自動で紐づくカレンダーアプリ</div>
      </div>
      <div class="app-arrow">→</div>
    </a>
  </div>

  <footer>
    &copy; Nexio LaVs. お問い合わせ: <a href="mailto:nexiolavs.support@gmail.com">nexiolavs.support@gmail.com</a>
  </footer>
</div>
</body>
</html>
